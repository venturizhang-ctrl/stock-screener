<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2C5F8A"/>
      <stop offset="100%" stop-color="#4A90D9"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  <!-- K线柱体 -->
  <rect x="120" y="180" width="32" height="140" rx="4" fill="#fff" opacity="0.9"/>
  <rect x="170" y="220" width="32" height="80" rx="4" fill="#fff" opacity="0.9"/>
  <rect x="220" y="130" width="32" height="200" rx="4" fill="#fff"/>
  <rect x="270" y="200" width="32" height="110" rx="4" fill="#fff" opacity="0.9"/>
  <rect x="320" y="150" width="32" height="160" rx="4" fill="#fff" opacity="0.9"/>
  <!-- 上升箭头 -->
  <path d="M370 300 L280 180 L220 220 L160 300" stroke="#FFD54F" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="370,300 350,270 380,285" fill="#FFD54F"/>
  <!-- 百分比 -->
  <text x="256" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="64" font-weight="bold" fill="#fff" opacity="0.9">+3%</text>
</svg>
